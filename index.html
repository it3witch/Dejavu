<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Déjà vu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="./tailwind.config.js"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="lofiCanvas" aria-hidden="true"></canvas>
  <div id="softVignette" class="soft-vignette" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <nav id="mainNav" class="nav" data-active="journal" aria-label="主菜单">
        <div class="nav-indicator" aria-hidden="true"></div>
        <button class="nav-button active" type="button" data-route="journal">
          <i class="fa-solid fa-pen-nib"></i><span>记录</span>
        </button>
        <button class="nav-button" type="button" data-route="search">
          <i class="fa-solid fa-magnifying-glass"></i><span>检索</span>
        </button>
        <button class="nav-button" type="button" data-route="square">
          <i class="fa-solid fa-layer-group"></i><span>大厅</span>
        </button>
      </nav>
    </header>

    <main>
      <section id="journalView" class="view active" data-view="journal">
        <div class="journal-wrap">
          <h1 class="quiet-title">记录梦境</h1>
          <form id="dreamForm" class="panel journal-card" autocomplete="off">
            <div class="note-count" id="charCount">0</div>
            <textarea id="dreamText" class="text-field dream-input" placeholder="写下梦里残留的一句话、一个地点或一段声音。"></textarea>

            <div class="journal-actions">
              <div class="action-left">
                <div class="emotion-picker">
                  <button id="emotionTrigger" class="emotion-orb" type="button" aria-label="选择标签" aria-expanded="false">
                    <i id="emotionIcon" class="fa-regular fa-face-smile"></i>
                  </button>
                  <div id="emotionMenu" class="emotion-menu" role="menu" aria-label="标签菜单">
                    <div class="emotion-menu-head">选择标签</div>
                    <div id="emotionList" class="emotion-list"></div>
                    <div class="custom-tag-row">
                      <input id="customEmotionInput" class="custom-tag-input" type="text" maxlength="8" placeholder="自定义" />
                      <button id="addEmotionButton" class="custom-tag-button" type="button" aria-label="添加自定义标签">
                        <i class="fa-solid fa-plus"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <label class="switch">
                  <span>匿名公开</span>
                  <input id="publicSwitch" class="sr-only" type="checkbox" />
                  <span class="switch-track" aria-hidden="true"><span class="switch-dot"></span></span>
                </label>
              </div>

              <div class="action-right">
                <button class="primary-button" type="submit">
                  <i class="fa-solid fa-plus"></i>保存
                </button>
              </div>
            </div>
          </form>
        </div>
      </section>

      <section id="searchView" class="view" data-view="search">
        <div class="search-layout">
          <form id="searchForm" class="panel search-card" autocomplete="off">
            <span class="section-label"><i class="fa-solid fa-wave-square"></i> Recall</span>
            <h2 class="section-title">既视感检索</h2>

            <div class="mt-7">
              <label class="field-head" for="searchText">
                <span>现实场景</span>
                <span id="resultBrief">待检索</span>
              </label>
              <textarea id="searchText" class="text-field scene-input" placeholder="雨后的巷子，红色售货机，熟悉的门。"></textarea>
              <div class="quick-row">
                <button class="quick-chip" type="button" data-query="雨后的街道，红色自动售货机，一只会发光的猫从霓虹灯下面经过。">雨夜</button>
                <button class="quick-chip" type="button" data-query="地铁站没有尽头，广播念着我的名字，墙上全是小时候的照片。">地铁</button>
                <button class="quick-chip" type="button" data-query="办公室漂浮在太空里，电脑屏幕像星图一样展开。">太空</button>
              </div>
            </div>

            <button id="runSearch" class="primary-button mt-6 w-full" type="submit">
              <i class="fa-solid fa-magnifying-glass"></i>检索
            </button>
          </form>

          <div id="searchResults" class="result-stack"></div>
        </div>
      </section>

      <section id="squareView" class="view square-view" data-view="square">
        <div class="w-full">
          <div class="square-head">
            <div>
              <span class="section-label"><i class="fa-solid fa-layer-group"></i> Public</span>
              <h2 class="section-title">梦境大厅</h2>
            </div>
            <div class="square-controls">
              <div id="squareModes" class="mode-row" aria-label="大厅内容">
                <button class="filter-chip active" type="button" data-square-mode="public">公开</button>
                <button class="filter-chip" type="button" data-square-mode="history">历史</button>
              </div>
              <div id="squareFilters" class="filter-row">
                <button class="filter-chip active" type="button" data-filter="全部">全部</button>
                <button class="filter-chip" type="button" data-filter="喜悦">喜悦</button>
                <button class="filter-chip" type="button" data-filter="焦虑">焦虑</button>
                <button class="filter-chip" type="button" data-filter="诡异">诡异</button>
                <button class="filter-chip" type="button" data-filter="科幻">科幻</button>
              </div>
            </div>
          </div>
          <div id="squareList" class="square-grid"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="detailModal" class="modal" aria-hidden="true">
    <article class="modal-card">
      <div class="mb-4 flex items-start justify-between gap-4">
        <div id="modalMeta" class="meta-row"></div>
        <button id="closeModal" class="icon-button" type="button" aria-label="关闭详情">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <p id="modalText" class="text-base leading-8 text-stone-800"></p>
      <div id="modalFoot" class="mt-5 text-xs text-stone-500"></div>
    </article>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <template id="dreamCardTemplate">
    <article class="dream-card" tabindex="0">
      <div class="meta-row">
        <span class="emotion-badge"></span>
        <span class="dream-date text-xs text-stone-500"></span>
      </div>
      <p class="card-text dream-text"></p>
      <div class="relative mt-5 flex items-center justify-between gap-3 text-xs text-stone-500">
        <span class="dream-author"></span>
        <span class="dream-visibility"></span>
      </div>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
