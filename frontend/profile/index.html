<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Déjà vu · 个人资料</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="../tailwind.config.js"></script>
  <link rel="stylesheet" href="../styles.css" />
  <script src="../config.js"></script>
</head>
<body>
  <canvas id="lofiCanvas" aria-hidden="true"></canvas>
  <div id="softVignette" class="soft-vignette" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <nav id="mainNav" class="nav" data-active="profile" aria-label="主菜单">
        <div class="nav-indicator" aria-hidden="true"></div>
        <a class="nav-button" href="/" data-route="journal">
          <i class="fa-solid fa-pen-nib"></i><span>记录</span>
        </a>
        <a class="nav-button" href="/search/" data-route="search">
          <i class="fa-solid fa-magnifying-glass"></i><span>检索</span>
        </a>
        <a class="nav-button" href="/square/" data-route="square">
          <i class="fa-solid fa-layer-group"></i><span>大厅</span>
        </a>
      </nav>
    </header>

    <main>
      <section id="profileView" class="view profile-view active" data-view="profile">
        <div class="profile-shell">
          <div class="square-head profile-head">
            <div>
              <span class="section-label"><i class="fa-regular fa-user"></i> Account</span>
              <h2 class="section-title">个人资料</h2>
            </div>
          </div>

          <div id="profileSignedInPanel" class="profile-layout">
            <article class="panel profile-preview">
              <span class="section-label"><i class="fa-regular fa-address-card"></i> Profile</span>
              <div id="profileAvatarPreview" class="profile-avatar-preview" role="button" tabindex="0" aria-label="更换头像">D</div>
              <input id="profileAvatarInput" class="sr-only" type="file" accept="image/*" />
              <h3 id="profilePreviewName" class="profile-preview-name">未命名</h3>
              <p id="profilePreviewHandle" class="profile-preview-handle">@unique00</p>
              <p id="profilePreviewSignature" class="profile-preview-signature">还没有签名</p>
            </article>

            <form id="profileForm" class="panel profile-card profile-form" autocomplete="off">
              <div class="profile-grid">
                <label class="profile-field" for="profileHandle">
                  <span class="profile-label">ID</span>
                  <input id="profileHandle" class="profile-input" type="text" maxlength="18" spellcheck="false" required />
                  <span class="profile-hint">3-18 位小写英文、数字或下划线</span>
                </label>

                <label class="profile-field" for="profileDisplayName">
                  <span class="profile-label">昵称</span>
                  <input id="profileDisplayName" class="profile-input" type="text" maxlength="24" placeholder="未命名" />
                  <span class="profile-hint">昵称可以重复</span>
                </label>

                <label class="profile-field full" for="profileEmail">
                  <span class="profile-label">绑定邮箱</span>
                  <input id="profileEmail" class="profile-input" type="email" disabled />
                </label>

                <label class="profile-field full" for="profileSignature">
                  <span class="profile-label">签名</span>
                  <textarea id="profileSignature" class="profile-input" maxlength="80" placeholder="写一句留给梦境大厅的话"></textarea>
                </label>

              </div>

              <div class="profile-actions">
                <button id="profileSaveButton" class="primary-button" type="submit">
                  <i class="fa-regular fa-floppy-disk"></i>
                  <span>保存修改</span>
                </button>
                <button id="profileSignOutButton" class="danger-button" type="button">
                  <i class="fa-solid fa-arrow-right-from-bracket"></i>
                  <span>退出登录</span>
                </button>
              </div>

              <p id="profileMessage" class="profile-message" role="status" aria-live="polite"></p>
            </form>
          </div>

          <div id="profileGuestPanel" class="empty-state profile-empty hidden">
            <div>
              <i class="fa-regular fa-user mb-4 text-2xl text-stone-600"></i>
              <div>登录后查看个人资料。</div>
            </div>
            <button id="profileLoginButton" class="primary-button" type="button">
              <i class="fa-regular fa-envelope"></i>
              <span>登录</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">dejavu 2026</footer>
  </div>

  <button id="accountButton" class="account-bubble" type="button" aria-label="登录状态">
    <i class="fa-regular fa-user"></i>
    <span id="accountLabel">登录</span>
  </button>

  <div id="authModal" class="auth-modal" aria-hidden="true">
    <article class="auth-card">
      <button id="authClose" class="auth-close icon-button" type="button" aria-label="关闭登录窗口">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div id="authSetupPanel" class="auth-panel hidden">
        <span class="section-label"><i class="fa-solid fa-plug-circle-bolt"></i> Setup</span>
        <h2 class="auth-title">连接 Supabase</h2>
        <p class="auth-copy">部署前需要填入 Project URL 和 anon public key。service_role key 不能放在前端。</p>
        <code class="setup-code">frontend/config.js</code>
      </div>

      <div id="authLoginPanel" class="auth-panel">
        <span class="section-label"><i class="fa-regular fa-envelope"></i> Account</span>
        <h2 class="auth-title">进入梦境</h2>
        <p class="auth-copy">输入邮箱，收到邮件后请填入 8 位验证码</p>
        <form id="authForm" class="auth-form" autocomplete="on">
          <input id="authEmail" class="auth-input" type="email" placeholder="you@example.com" required />
          <input id="authOtp" class="auth-input hidden" type="text" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" autocomplete="one-time-code" placeholder="8 位验证码" />
          <button id="authSubmit" class="primary-button w-full" type="submit">
            <i class="fa-solid fa-paper-plane"></i>
            <span id="authSubmitLabel">发送邮箱验证码</span>
          </button>
          <button id="authBackButton" class="ghost-button w-full hidden" type="button">
            <i class="fa-solid fa-arrow-left"></i>
            换一个邮箱
          </button>
        </form>
        <p id="authMessage" class="auth-message"></p>
      </div>

      <div id="authSignedInPanel" class="auth-panel hidden">
        <span class="section-label"><i class="fa-regular fa-circle-check"></i> Signed in</span>
        <h2 class="auth-title">已经登录</h2>
        <p id="authUser" class="auth-copy"></p>
        <button id="signOutButton" class="ghost-button w-full" type="button">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          退出登录
        </button>
      </div>
    </article>
  </div>

  <div id="detailModal" class="modal" aria-hidden="true">
    <article class="modal-card">
      <div class="mb-4 flex items-start justify-between gap-4">
        <div id="modalMeta" class="meta-row"></div>
        <button id="closeModal" class="icon-button" type="button" aria-label="关闭详情">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <p id="modalText" class="text-base leading-8 text-stone-800"></p>
      <div id="modalFoot" class="mt-5 text-xs text-stone-500"></div>
    </article>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <template id="dreamCardTemplate">
    <article class="dream-card" tabindex="0">
      <div class="dream-card-head">
        <div class="dream-author-block">
          <span class="dream-avatar" aria-hidden="true"></span>
          <span class="dream-author-copy">
            <span class="dream-author"></span>
            <span class="dream-handle"></span>
          </span>
        </div>
        <span class="emotion-badge"></span>
      </div>
      <p class="card-text dream-text"></p>
      <div class="dream-card-foot">
        <span class="dream-time"><i class="fa-regular fa-clock"></i><span class="dream-date"></span></span>
        <span class="dream-social" aria-label="互动">
          <button class="dream-social-button" type="button"><i class="fa-regular fa-heart"></i><span>0</span></button>
          <button class="dream-social-button" type="button"><i class="fa-regular fa-comment"></i><span>0</span></button>
        </span>
      </div>
    </article>
  </template>

  <script type="module" src="../app.js?v=20260804-avatar-click"></script>
</body>
</html>
